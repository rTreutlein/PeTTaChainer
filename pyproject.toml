[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[project]
name = "PeTTaChainer"
version = "0.1.0"
description = "Backward and forward PLN chaining on top of PeTTa"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "petta",
]

# Vendored PeTTa with the unified checker (upstream e038e4d + local unified-checker
# work, reconstructed from the former /tmp/petta-unified-checker@c33851b pin).
[tool.uv.sources]
petta = { path = "third_party/petta" }

[tool.setuptools.packages.find]
include = ["pettachainer*"]
namespaces = false

[tool.setuptools.package-data]
pettachainer = [
    "LANGUAGE_SPEC.md",
    "LLM_RULE_SPEC.md",
    "metta/*.metta",
    "metta/core/*.metta",
    "metta/core/formulas/*.metta",
    "metta/core/logic_configs/*.metta",
    "metta/compiler/*.metta",
    "metta/runtime/*.metta",
    "metta/runtime/forward/*.metta",
    "metta/runtime/backward/*.metta",
    "metta/prolog/*.pl",
]
