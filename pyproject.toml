[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "PeTTaChainer"
version = "0.1.0"
description = "Backward and forward PLN chaining on top of PeTTa"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "petta>=0.1.0",
]

[tool.uv.sources]
petta = { git = "https://github.com/trueagi-io/PeTTa", rev = "4843144ba569a896991fc6d84a30f1136488fee1" }

[tool.setuptools.packages.find]
include = ["pettachainer*"]
